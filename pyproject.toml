[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "puffer-cipher"
version = "0.1.0"
description = "Cryptographic key generation and encryption seeded by live fish: computer vision entropy, liveness-verified video, NIST health tests and a signed public randomness beacon."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "lukamaga" }]
keywords = ["entropy", "randomness", "cryptography", "computer-vision", "lavarand", "beacon", "libsodium"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "pynacl>=1.5",
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3"]
pi = ["gpiozero>=2.0"]
analysis = ["matplotlib>=3.8"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "mypy>=1.10",
  "ruff>=0.5",
  "matplotlib>=3.8",
  "pillow>=10",
  "gpiozero>=2.0",
]

[project.scripts]
puffer = "puffer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/puffer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: long-running statistical tests (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802", "N806"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.11"
files = ["src/puffer"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
